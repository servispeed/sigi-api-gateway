version: '3.8'

services:
  api-gateway:
    image: sigi-api-gateway:latest
    container_name: sigi-api-gateway-prod
    ports:
      - "127.0.0.1:8088:8088"
    extra_hosts:
      - "host.docker.internal:host-gateway" 
    restart: unless-stopped
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE=50MB
      - SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE=50MB
      - ZUUL_HOST_CONNECT_TIMEOUT_MILLIS=60000
      - ZUUL_HOST_SOCKET_TIMEOUT_MILLIS=60000
      - HYSTRIX_COMMAND_DEFAULT_EXECUTION_ISOLATION_THREAD_TIMEOUTINMILLISECONDS=60000
      # Si en el futuro quieres cambiar la clave secreta en producción sin tocar el código:
      # - JWT_SECRET=UnaNuevaClaveSuperSeguraParaProduccion123!